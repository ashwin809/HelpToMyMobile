services:
  postgres:
    image: postgres:17-alpine
    container_name: helptoyou-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helptoyou
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helptoyou-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - helptoyou-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helptoyou"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  helptoyou-postgres-data:
